<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naila Rechima | Portfolio</title>
    <!-- Importing a premium editorial serif font (Cinzel for headers) and a clean geometric sans-serif for UI elements -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables defining the custom premium chic palette */
        :root {
            --bg-main: #0a0a0a;
            --card-bg: #111111;
            --accent-bronze: #c5a880;
            --accent-glow: rgba(197, 168, 128, 0.08);
            --text-primary: #f5f5f5;
            --text-secondary: #999999;
            --font-editorial: 'Playfair Display', 'Georgia', serif;
            --font-header: 'Cinzel', serif;
            --font-ui: 'Inter', sans-serif;
            --nav-blur: rgba(10, 10, 10, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-editorial);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* 5. Navigation Bar: Fixed, semi-transparent frosted glass (blur effect) with minimalist text links and a clean search icon */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: var(--nav-blur);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            z-index: 1000;
        }

        .nav-logo {
            font-family: var(--font-header);
            font-size: 0.95rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-primary);
            font-weight: 500;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 40px;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: var(--accent-bronze);
        }

        /* Clean Search Icon Component */
        .search-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .search-icon {
            width: 13px;
            height: 13px;
            border: 1.5px solid var(--text-secondary);
            border-radius: 50%;
            position: relative;
            transition: border-color 0.3s ease;
        }

        .search-icon::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 1.5px;
            background-color: var(--text-secondary);
            transform: rotate(45deg);
            bottom: -3px;
            right: -3px;
            transition: background-color 0.3s ease;
        }

        .search-container:hover .search-icon {
            border-color: var(--accent-bronze);
        }

        .search-container:hover .search-icon::after {
            background-color: var(--accent-bronze);
        }

        /* 4. "Magazine-style" Editorial Layout Core Framework */
        main {
            max-width: 1200px;
            margin: 180px auto 0 auto;
            padding: 0 60px;
        }

        /* Hero Header Branding Layout */
        header {
            margin-bottom: 100px;
        }

        /* 10. Core Title */
        h1 {
            font-family: var(--font-header);
            font-size: 2.4rem;
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: 0.02em;
            margin-bottom: 35px;
            color: var(--text-primary);
        }

        /* Approved Profile Text Content */
        .hero-desc {
            font-family: var(--font-editorial);
            font-size: 1.35rem;
            color: var(--text-secondary);
            max-width: 850px;
            line-height: 1.75;
            margin-bottom: 50px;
            font-style: italic;
        }

        /* 7. Clean Minimalist Horizontal Menu Bar */
        .horizontal-action-bar {
            display: flex;
            align-items: center;
            gap: 45px;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .horizontal-action-bar a {
            color: var(--text-primary);
            text-decoration: none;
            position: relative;
            padding: 6px 0;
            transition: color 0.3s ease;
        }

        .horizontal-action-bar a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--text-secondary);
            transform: scaleX(0.2);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.4s ease;
        }

        .horizontal-action-bar a:hover {
            color: var(--accent-bronze);
        }

        .horizontal-action-bar a:hover::after {
            transform: scaleX(1);
            background-color: var(--accent-bronze);
        }

        /* Section Section Headings */
        .grid-header-title {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 45px;
        }

        /* 5. Cards & Grids: Borderless grid items with subtle, rounded corners relying on structured spacing */
        .editorial-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
        }

        /* 5. Interactive Elements: Fluid micro-interactions, gentle hover lifts and smooth transitions */
        .project-card {
            background-color: var(--card-bg);
            padding: 50px;
            border-radius: 12px;
            border: none;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 400px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        .card-meta {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-bronze);
            margin-bottom: 30px;
        }

        .card-title {
            font-family: var(--font-editorial);
            font-size: 1.8rem;
            font-weight: 400;
            line-height: 1.35;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .card-desc {
            font-family: var(--font-editorial);
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* 9. Supporting Functional Document/Matrix Component Structure Layer Inside the Framework */
        .embedded-qms-doc {
            background-color: #060606;
            padding: 25px;
            border-radius: 6px;
            margin-top: auto;
            margin-bottom: 35px;
        }

        .embedded-qms-doc h4 {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .doc-matrix-preview {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-collapse: collapse;
            width: 100%;
        }

        .doc-matrix-preview td {
            padding: 6px 0;
        }

        /* 5. Buttons: Understated, pill-shaped primary action buttons with smooth color transitions */
        .pill-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            border-radius: 40px;
            background-color: transparent;
            border: 1px solid var(--accent-bronze);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            align-self: flex-start;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .pill-button:hover {
            background-color: var(--text-primary);
            color: var(--bg-main);
            border-color: var(--text-primary);
        }

        .skills-footer {
            margin-top: 140px;
        }

            display: flex;
